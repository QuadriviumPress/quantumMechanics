name: Generated figures

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate_figures*.py'
      - 'requirements-figures.txt'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-figures.txt
      - run: scripts/check-figures.sh
